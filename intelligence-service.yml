server:
  port: 9030
  servlet:
    context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/lovable-clone-intelligence-service-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://api.openai.ai
      chat:
        options:
          model: gpt-5.4-mini
          temperature: 0.0
          stream-usage: true

---
spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: gpt-5.4-mini
          temperature: 0.0
          stream-usage: true
